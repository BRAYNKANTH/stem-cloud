name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # same as the Vercel Python runtime
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Byte-compile backend and tools
        run: python -m compileall -q api stemcloud tools tests
      - name: Account and API flow
        run: python tests/test_flow.py
      - name: Migrations and lesson gate cookie
        run: python tests/test_backend.py
      - name: R2 media routing
        run: python tests/test_r2_storage.py
