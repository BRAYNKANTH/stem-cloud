name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # same as the Vercel Python runtime
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Byte-compile backend and tools
        run: python -m compileall -q api stemcloud content_schema tools tests
      - name: Account and API flow
        run: python tests/test_flow.py
      - name: Migrations and lesson gate cookie
        run: python tests/test_backend.py
      - name: The cut-over switch (old lesson and topic pages to the new ones)
        run: python tests/test_cutover.py
      - name: R2 media routing
        run: python tests/test_r2_storage.py
      - name: Lesson format
        run: python tests/test_content_schema.py
      - name: Sinhala layer port (follows si.js)
        run: python tests/test_sinhala.py
      - name: Lesson content is current with the lesson pages, nothing lost
        run: python tools/extract_lesson.py --all --check
      - name: Lesson content (format, legacy links, stable ids, catalog, no empty drawings)
        run: python tools/validate_content.py
      - name: Lesson content styles are current with the lesson pages
        run: python tools/lesson_css.py --check
      - name: Progress v1 -> v2 map is current with the lesson content
        run: python tools/legacy_map.py --check
      - name: Past papers styles are current with the current page
        run: python tools/past_papers_css.py --check
      - name: The labs' cartoon engine is current with the lesson pages
        run: python tools/lab_engine.py --check
      - name: The slider labs are current with the lesson pages
        run: python tools/slider_labs.py --check
      - name: The sort games are current with the lesson pages
        run: python tools/sort_games.py --check
      - name: The challenge games are current with the lesson pages
        run: python tools/challenge_games.py --check
      - name: The level games are current with the lesson pages
        run: python tools/level_games.py --check
      - name: The Watch animations are current with the lesson pages
        run: python tools/watch_anims.py --check
      - name: Past paper question banks (content/past-papers)
        run: |
          python tools/validate_past_papers.py
          python tests/test_past_paper_content.py

  web:
    name: Web app (type check, build, JS budget)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Lesson types are generated from the Python lesson format
        working-directory: .
        run: |
          pip install -r requirements.txt
          python tools/content_types.py --check
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: JavaScript budget (60 KB gzipped per page)
        run: npm run budget
      - name: Lesson pages in a browser (every chapter at 375 px and desktop; player, story, quiz)
        working-directory: .
        timeout-minutes: 15
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          python tests/test_lesson_pages.py
