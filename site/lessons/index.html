<script>
function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }
function readJSON(key, fallback){ try{ const v = safeGet(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }

let APP_LANG = 'en';
let hubRenderHook = null;
function t(en, ta, si){ return APP_LANG === 'ta' ? ta : (APP_LANG === 'si' && si ? si : en); }

function captureI18n(){ document.querySelectorAll('[data-ta]').forEach(function(e){ if(e.dataset.en === undefined){ e.dataset.en = e.innerHTML; } }); }
function applyLang(lang){
  APP_LANG = lang;
  captureI18n();
  window.STEM_LANG = lang;
  document.querySelectorAll('[data-ta]').forEach(function(e){ e.innerHTML = (lang === 'ta') ? e.dataset.ta : (lang === 'si' && e.dataset.si ? e.dataset.si : e.dataset.en); });
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-ta', lang === 'ta');
  document.body.classList.toggle('lang-si', lang === 'si');
  const langBtn = document.getElementById('langToggle');
  if(langBtn){ langBtn.textContent = '🌐 ' + (lang === 'ta' ? 'தமிழ்' : lang === 'si' ? 'සිංහල' : 'English'); if(window.StemSI) StemSI.labelBtn(langBtn); }
  if(hubRenderHook) hubRenderHook();
  safeSet('lessonLang', lang);
}

/* light / dark lives in the account menu (it clicks this hidden button) */
(function(){
  const btn = document.getElementById('themeToggle'), root = document.documentElement;
  const saved = safeGet('lessonTheme'); if(saved){ root.setAttribute('data-theme', saved); }
  btn.addEventListener('click', function(){
    const cur = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const next = cur === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next); safeSet('lessonTheme', next);
  });
})();

============================================================ */

/* Today counts as a visit, same rule as the lesson pages. */
function streakDays(){
  const today = new Date().toISOString().slice(0,10);
  const dates = readJSON('scx_visit_dates', []);
  if(!dates.includes(today)){ dates.push(today); safeSet('scx_visit_dates', JSON.stringify(dates)); }
  dates.sort();
  let streak = 1;
  for(let i = dates.length - 1; i > 0; i--){
    const diff = Math.round((new Date(dates[i]) - new Date(dates[i-1])) / 86400000);
    if(diff === 1){ streak++; } else if(diff > 1){ break; }
  }
  return streak;
}

function progressOf(l){
  const o = readJSON('scx_path_' + l.lid, {});
  const seen = Math.min(Object.keys(o).filter(k => o[k]).length, l.steps);
  const done = safeGet('scx_done_' + l.lid) === '1' || seen >= l.steps;
  return { seen: seen, done: done, pct: done ? 100 : Math.round(seen / l.steps * 100) };
}

  star:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#FFB21E" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/></svg>',
  fire:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#FF7A1A" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
  medal:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#3443D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="15" r="6"/><path d="M8.5 10L6 3h4l2 5M15.5 10L18 3h-4l-2 5"/></svg>',
  chev:'<svg class="rc" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
};
function render(){
  const xp = parseInt(safeGet('scx_xp_total') || '0', 10) || 0;
  const badges = readJSON('scx_badges', []).length;
  const prog = LESSONS.map(progressOf);
  const doneN = prog.filter(p => p.done).length;

  /* hello + four stat tiles */
  const U = window.SCX_USER || {};
  const name = String(U.display_name || U.username || '').trim().split(/\s+/)[0];
  document.getElementById('cHi').textContent = name ? t('Hi, ', 'வணக்கம், ', 'ආයුබෝවන්, ') + name : t('Hi!', 'வணக்கம்!', 'ආයුබෝවන්!');
  const tile = (icon, num, label) => '<div class="c-tile"><b>' + icon + num + '</b><span>' + label + '</span></div>';
  document.getElementById('cStats').innerHTML =
    tile('', doneN + '/' + LESSONS.length, t('chapters', 'பாடங்கள்', 'පරිච්ඡේද')) +
    tile(ICON.star, xp, 'XP') +
    tile(ICON.fire, streakDays(), t('day streak', 'நாள் தொடர்', 'දින අඛණ්ඩව')) +
    tile(ICON.medal, badges, t('badges', 'பேட்ஜ்', 'පදක්කම්'));

  /* where to go next: the lesson you were in, else the first one not finished (the welcome first for a new student) */
  const lastFile = safeGet('stem_last_lesson');
  let idx = LESSONS.findIndex(l => l.file === lastFile);
  if(idx >= 0 && prog[idx].done) idx = -1;
  if(idx < 0) idx = prog.findIndex(p => !p.done);
  const cta = document.getElementById('cCta');
  let target, word, seen;
  if(idx < 0 && doneN === 0){ idx = 0; }
  if(idx < 0){
    target = LESSONS[LESSONS.length - 1]; word = t('Review', 'திருப்பி பாரு', 'නැවත බලන්න'); seen = target.steps;
    cta.href = target.file;
  } else {
    target = LESSONS[idx]; seen = prog[idx].seen;
    word = seen > 0 ? t('Continue', 'தொடர்', 'ඉදිරියට') : t('Start', 'தொடங்கு', 'ආරම්භ කරන්න');
    cta.href = target.file + (seen > 0 ? '?resume=1' : '');
  }
  const mod = MODULES.find(m => m.id === target.m);
  document.getElementById('cKick').textContent = word + ' · ' + t(mod.en, mod.ta, mod.si) + ' · ' + t('Chapter ', 'அத். ', 'පරිච්ඡේදය ') + target.n;
  document.getElementById('cCtaT').textContent = t(target.en, target.ta, target.si);
  document.getElementById('cCtaW').textContent = word;
  let seg = '';
  for(let k = 0; k < target.steps; k++) seg += '<i class="' + (k < seen ? 'd' : (k === seen ? 'n' : '')) + '"></i>';
  const segBox = document.getElementById('cSeg');
  segBox.innerHTML = seg;
  segBox.setAttribute('aria-label', seen + ' / ' + target.steps + ' ' + t('steps done', 'படிகள் முடிஞ்சது', 'පියවර අවසන්'));
  document.getElementById('cLeft').textContent = seen + ' / ' + target.steps + ' ' + t('steps done', 'படிகள் முடிஞ்சது', 'පියවර අවසන්');
  const nowFile = target.file;

  /* grade tabs (and past papers), then the chapters of the chosen grade as cards */
  const sel = SEL || target.m;
  document.getElementById('cTabs').innerHTML = MODULES.map(m =>
    '<button type="button" data-m="' + m.id + '" aria-pressed="' + (m.id === sel) + '">' + t(m.en, m.ta, m.si) + '</button>').join('') +
    '<a href="past-papers.html">' + t('Past papers', 'கடந்த வினாத்தாள்', 'පසුගිය ප්‍රශ්න පත්‍ර') + '</a>';
  let h = '';
  MODULES.forEach(function(m){
    const items = LESSONS.map((l, i) => [l, prog[i]]).filter(x => x[0].m === m.id);
    const mDone = items.filter(x => x[1].done).length;
    const open = m.id === sel;
    h += '<details class="mod" data-m="' + m.id + '"' + (open ? ' open' : ' hidden') + '><summary><span class="mi" aria-hidden="true">' + m.icon + '</span><span class="mt">' + t(m.en, m.ta, m.si) + '</span><span class="mc">' + mDone + ' / ' + items.length + '</span></summary><ol>';
    items.forEach(function(x){
      const l = x[0], p = x[1];
      const state = p.done ? t('completed', 'முடிஞ்சது', 'අවසන්') : (p.seen ? t('in progress', 'நடந்துட்டிருக்கு', 'සිදුවෙමින් පවතී') : t('not started', 'ஆரம்பிக்கல', 'ආරම්භ කර නැත'));
      h += '<li><a class="row' + (l.file === nowFile ? ' now' : '') + (p.done ? ' fin' : '') + '" href="' + l.file + '">' +
        '<span class="st' + (p.done ? ' done' : '') + '" style="--p:' + p.pct + '" aria-hidden="true"><span>' + (p.done ? '✓' : l.n) + '</span></span>' +
        '<span class="rt"><b>' + t(l.en, l.ta, l.si) + '</b><small aria-hidden="true">' + state + '</small></span>' +
        '<span class="rm" aria-hidden="true">' + (p.seen && !p.done ? p.seen + ' / ' + l.steps : l.steps + ' ' + t('steps', 'படிகள்', 'පියවර')) + '</span>' + ICON.chev +
        '<span class="sr-only">' + t('Chapter ', 'அத். ', 'පරිච්ඡේදය ') + l.n + ', ' + state + (p.seen && !p.done ? ', ' + p.seen + ' / ' + l.steps : '') + '</span></a></li>';
    });
    h += '</ol></details>';
  });
  document.getElementById('toc').innerHTML = h;
}
document.getElementById('cTabs').addEventListener('click', function(e){
  const b = e.target.closest('button[data-m]'); if(!b) return;
  SEL = b.dataset.m; render();
  const nb = document.querySelector('#cTabs button[data-m="' + SEL + '"]'); if(nb) nb.focus();
});
hubRenderHook = render;
applyLang(safeGet('lessonLang') || 'en');
window.addEventListener('pageshow', function(){ render(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });
</script>
</body>
</html>
