<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics is EASY! — Meet Raja & Chittu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap"></noscript>
<style>
  :root{
    --bg:#0b0f17; --panel:#141d2c; --panel-2:#182338; --border:#25324a;
    --text:#e7edf7; --text-dim:#a7b3c8; --text-faint:#6d7c96;
    --accent:#5ee0c2; --accent-2:#8b7bff; --accent-3:#ff9f6b; --good:#5ee0c2;
    --raja:#3a2a18; --raja-b:#ffb869; --chittu:#12303f; --chittu-b:#5cc0f2;
    --shadow:0 10px 30px rgba(0,0,0,.35); --radius:18px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f2f5fc; --border:#dbe2f0;
      --text:#1a2233; --text-dim:#4c5773; --text-faint:#8391ab;
      --accent:#0c9e83; --accent-2:#5b46e0; --accent-3:#d9762f; --good:#0c9e83;
      --raja:#fff1e0; --raja-b:#ffb869; --chittu:#e6f6ff; --chittu-b:#5cc0f2;
      --shadow:0 10px 30px rgba(30,40,70,.08);
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f2f5fc; --border:#dbe2f0;
    --text:#1a2233; --text-dim:#4c5773; --text-faint:#8391ab;
    --accent:#0c9e83; --accent-2:#5b46e0; --accent-3:#d9762f; --good:#0c9e83;
    --raja:#fff1e0; --raja-b:#ffb869; --chittu:#e6f6ff; --chittu-b:#5cc0f2;
    --shadow:0 10px 30px rgba(30,40,70,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans Tamil','Inter',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;}
  body.lang-en{font-family:'Inter','Noto Sans Tamil',system-ui,sans-serif;}
  body::before{
    content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 42%),
      radial-gradient(circle at 88% 6%, color-mix(in srgb, var(--accent-2) 18%, transparent), transparent 38%),
      radial-gradient(circle at 80% 92%, color-mix(in srgb, var(--accent-3) 16%, transparent), transparent 42%),
      radial-gradient(circle at 8% 85%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 40%),
      var(--bg);
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(color-mix(in srgb, var(--text) 10%, transparent) 1px, transparent 1px);
    background-size:24px 24px;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 75%);
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 75%);
    opacity:.5;
  }
  h1,h2,h3{font-family:'Sora','Noto Sans Tamil',sans-serif;margin:0 0 .4em;}
  body.lang-ta h1,body.lang-ta h2,body.lang-ta h3{font-family:'Noto Sans Tamil','Sora',sans-serif;}
  a{color:var(--accent);}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px 100px;}

  .topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{font-family:'Sora';font-weight:800;color:var(--text);white-space:nowrap;}
  .brand span{color:var(--accent);}
  .toplink{color:var(--text-dim);text-decoration:none;font-size:.85rem;padding:6px 10px;border-radius:20px;}
  .toplink:hover{background:var(--panel-2);color:var(--text);}
  .toggles{margin-left:auto;display:flex;gap:8px;}
  .tbtn{border:1px solid var(--border);background:var(--panel);color:var(--text-dim);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:.78rem;font-family:inherit;white-space:nowrap;}
  .tbtn.lang{font-weight:700;color:var(--accent-2);border-color:color-mix(in srgb, var(--accent-2) 40%, var(--border));}

  .hero{text-align:center;padding:40px 0 10px;}
  .kicker{display:inline-flex;gap:8px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent);border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);padding:5px 12px;border-radius:20px;margin-bottom:14px;}
  .hero h1{font-size:2.6rem;line-height:1.15;}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--text-dim);max-width:54ch;margin:10px auto 0;font-size:1.02rem;}

  section.block{margin-top:50px;scroll-margin-top:80px;}
  .slabel{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .slabel .num{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0b0f17;font-family:'Sora';font-weight:800;}
  .slabel h2{font-size:1.4rem;margin:0;}
  .slabel .sub{color:var(--text-faint);font-size:.85rem;}

  /* ---------- Stage / dialogue ---------- */
  .stage{background:var(--panel);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:var(--radius);padding:20px 20px 18px;box-shadow:var(--shadow);margin-top:18px;}
  .chars{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;}
  .char{text-align:center;transition:transform .3s ease, filter .3s ease;filter:grayscale(.55) brightness(.9);transform:scale(.93);}
  .char.on{filter:none;transform:scale(1.04);}
  .char svg{width:100%;max-width:230px;height:auto;overflow:visible;}
  .char .nm{font-family:'Sora','Noto Sans Tamil';font-weight:800;font-size:1rem;margin-top:2px;}
  .char.r .nm{color:var(--raja-b);} .char.c .nm{color:var(--chittu-b);}
  .bubble{position:relative;margin:20px 6px 10px;padding:16px 20px;border-radius:18px;min-height:96px;font-size:1.08rem;font-weight:600;border:3px solid;display:flex;align-items:center;}
  .bubble.r{background:var(--raja);border-color:var(--raja-b);}
  .bubble.c{background:var(--chittu);border-color:var(--chittu-b);}
  .bubble::before{content:'';position:absolute;top:-14px;width:22px;height:22px;transform:rotate(45deg);background:inherit;border-left:3px solid;border-top:3px solid;border-color:inherit;}
  .bubble.r::before{left:22%;} .bubble.c::before{left:72%;}
  .bubble .who{position:absolute;top:-12px;right:16px;font-size:.7rem;font-weight:800;padding:2px 10px;border-radius:10px;color:#0b0f17;}
  .bubble.r .who{background:var(--raja-b);} .bubble.c .who{background:var(--chittu-b);}
  .caret{display:inline-block;width:2px;height:1.1em;background:currentColor;margin-left:2px;vertical-align:-3px;animation:blinkc .7s infinite;}
  @keyframes blinkc{50%{opacity:0;}}
  .ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:8px;}
  .dots{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:120px;}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--border);display:block;}
  .dots i.done{background:var(--accent);} .dots i.now{background:var(--accent-3);transform:scale(1.4);}
  .btn{display:inline-block;text-decoration:none;border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:10px 18px;border-radius:12px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0b0f17;border:none;}
  .btn:hover{filter:brightness(1.08);}
  .btn[disabled]{opacity:.45;cursor:default;}
  .endcta{display:none;text-align:center;margin-top:14px;animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
  .endcta.show{display:block;}
  @keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* character animation */
  .bob{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.08);}}
  .char.talking .r-mouth{animation:talkR .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0;}
  @keyframes talkR{from{transform:scaleY(.35);}to{transform:scaleY(1.1);}}
  .char.talking .c-beak{animation:talkC .22s ease-in-out infinite alternate;}
  @keyframes talkC{from{transform:translateY(0);}to{transform:translateY(5px);}}
  .wave{animation:wave 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:15% 85%;}
  @keyframes wave{0%,100%{transform:rotate(0);}50%{transform:rotate(-24deg);}}

  /* ---------- dream cards ---------- */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){.two{grid-template-columns:1fr;} .hero h1{font-size:2rem;}}
  .dream{border-radius:var(--radius);padding:20px 22px;border:2px solid;box-shadow:var(--shadow);}
  .dream.r{background:var(--raja);border-color:var(--raja-b);}
  .dream.c{background:var(--chittu);border-color:var(--chittu-b);}
  .dream h3{font-size:1.08rem;}
  .dream .big{font-size:2.4rem;letter-spacing:8px;}
  .dream ul{margin:8px 0 0;padding-left:20px;color:var(--text-dim);font-size:.92rem;}
  .dream p{margin:6px 0;color:var(--text-dim);font-size:.95rem;}
  .dream .tag{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:10px;color:#0b0f17;}
  .dream.r .tag{background:var(--raja-b);} .dream.c .tag{background:var(--chittu-b);}

  /* ---------- everywhere tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .tile{perspective:900px;height:250px;cursor:pointer;}
  .tile .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;}
  .tile.flip .in{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--border);border-top:4px solid var(--board,var(--accent));background:var(--panel);display:flex;flex-direction:column;}
  .face.back{transform:rotateY(180deg);background:color-mix(in srgb, var(--board,var(--accent)) 10%, var(--panel));}
  .tile:nth-child(3n+1){--board:var(--accent);} .tile:nth-child(3n+2){--board:var(--accent-2);} .tile:nth-child(3n){--board:var(--accent-3);}
  .scene{font-size:3rem;text-align:center;margin:4px 0;}
  .scene span{display:inline-block;animation:wig 1.6s ease-in-out infinite;}
  .scene span:nth-child(2){animation-delay:.2s;} .scene span:nth-child(3){animation-delay:.4s;}
  @keyframes wig{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-6px) rotate(-6deg);}}
  .face h3{font-size:1rem;margin:0 0 4px;} .face p{font-size:.9rem;color:var(--text-dim);margin:0;}
  .hint{margin-top:auto;font-size:.75rem;color:var(--text-faint);}
  .face .chip{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:10px;background:var(--board);color:#0b0f17;margin-bottom:6px;align-self:flex-start;}
  .face.back .go{margin-top:auto;font-weight:700;text-decoration:none;color:var(--board);}

  /* ---------- test ---------- */
  .q{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);}
  .q .qt{font-weight:700;margin-bottom:10px;}
  .opts{display:grid;gap:8px;}
  .opt{text-align:left;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:.95rem;}
  .opt:hover:not(:disabled){border-color:var(--accent-2);}
  .opt.ok{background:color-mix(in srgb, var(--good) 20%, var(--panel));border-color:var(--good);}
  .opt.no{background:color-mix(in srgb, #ff6b81 20%, var(--panel));border-color:#ff6b81;}
  .why{display:none;margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--panel-2);border:1px dashed var(--border);color:var(--text-dim);font-size:.9rem;}
  .why.show{display:block;}
  .score{text-align:center;font-weight:800;font-size:1.1rem;margin-top:6px;min-height:1.6em;}

  /* ---------- road ---------- */
  .road{display:grid;gap:14px;position:relative;}
  .road::before{content:'';position:absolute;left:26px;top:20px;bottom:20px;width:4px;background:repeating-linear-gradient(var(--border) 0 10px, transparent 10px 18px);}
  .stop{position:relative;display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--border);border-left:5px solid var(--board);border-radius:var(--radius);padding:14px 18px 14px 12px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .2s;}
  .stop:hover{transform:translateX(4px);border-color:var(--board);}
  .stop:nth-child(3n+1){--board:var(--accent);} .stop:nth-child(3n+2){--board:var(--accent-2);} .stop:nth-child(3n){--board:var(--accent-3);}
  .stop .n{width:44px;height:44px;border-radius:50%;background:var(--board);color:#0b0f17;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;z-index:1;margin-left:4px;}
  .stop h3{font-size:1rem;margin:0;} .stop p{margin:2px 0 0;font-size:.86rem;color:var(--text-dim);}
  .stop .say{font-size:.82rem;color:var(--text-faint);font-style:italic;margin-top:2px;}
  .stop .pips{font-size:.75rem;color:var(--text-faint);font-family:'Inter';white-space:nowrap;}
  .startbtn{display:block;text-align:center;margin-top:22px;}
  footer{text-align:center;color:var(--text-faint);font-size:.8rem;padding:46px 0 10px;}
</style>
</head>

<script>
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
let LANG = safeGet('lessonLang') || 'ta';
if(LANG !== 'en' && LANG !== 'ta') LANG = 'ta';
function T(en, ta){ return LANG === 'ta' ? ta : en; }

/* ============================================================
   CHARACTER ART (inline SVG, animated with CSS)
============================================================ */
function rajaSVG(){
  return '<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg"><g class="bob">'+
   '<path d="M146 196 C196 196 200 146 168 132" fill="none" stroke="#6b4220" stroke-width="11" stroke-linecap="round"/>'+
   '<ellipse cx="82" cy="232" rx="19" ry="10" fill="#6b4220"/><ellipse cx="118" cy="232" rx="19" ry="10" fill="#6b4220"/>'+
   '<ellipse cx="100" cy="186" rx="46" ry="48" fill="#e53935"/>'+
   '<path d="M72 150 Q100 166 128 150" fill="none" stroke="#b71c1c" stroke-width="4" stroke-linecap="round"/>'+
   '<ellipse cx="50" cy="180" rx="12" ry="24" fill="#8d5a2b" transform="rotate(14 50 180)"/>'+
   '<g class="wave"><ellipse cx="152" cy="176" rx="12" ry="24" fill="#8d5a2b" transform="rotate(-18 152 176)"/></g>'+
   '<circle cx="44" cy="98" r="19" fill="#8d5a2b"/><circle cx="44" cy="98" r="11" fill="#f0c79a"/>'+
   '<circle cx="156" cy="98" r="19" fill="#8d5a2b"/><circle cx="156" cy="98" r="11" fill="#f0c79a"/>'+
   '<circle cx="100" cy="94" r="56" fill="#8d5a2b"/>'+
   '<path d="M90 40 q10 -18 20 0" fill="none" stroke="#6b4220" stroke-width="6" stroke-linecap="round"/>'+
   '<ellipse cx="100" cy="110" rx="41" ry="37" fill="#f0c79a"/>'+
   '<g class="blink"><circle cx="82" cy="92" r="12" fill="#fff"/><circle cx="118" cy="92" r="12" fill="#fff"/>'+
   '<circle cx="85" cy="94" r="6" fill="#2b1a0a"/><circle cx="121" cy="94" r="6" fill="#2b1a0a"/>'+
   '<circle cx="87" cy="91" r="2" fill="#fff"/><circle cx="123" cy="91" r="2" fill="#fff"/></g>'+
   '<path d="M70 76 Q82 68 94 77" fill="none" stroke="#4a2c10" stroke-width="4" stroke-linecap="round"/>'+
   '<path d="M106 77 Q118 68 130 76" fill="none" stroke="#4a2c10" stroke-width="4" stroke-linecap="round"/>'+
   '<circle cx="94" cy="112" r="2.8" fill="#5b3a1a"/><circle cx="106" cy="112" r="2.8" fill="#5b3a1a"/>'+
   '<g class="r-mouth"><path d="M78 124 Q100 148 122 124 Q100 132 78 124 Z" fill="#7a1f1f"/><path d="M92 134 Q100 140 108 134 Q100 130 92 134Z" fill="#ff8a8a"/></g>'+
   '</g></svg>';
}
function chittuSVG(){
  return '<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg"><g class="bob" style="animation-delay:.5s">'+
   '<path d="M130 190 L170 222 L150 226 L124 206Z" fill="#7b4f27"/>'+

/* ============================================================
   DIALOGUE PLAYER
============================================================ */
let idx = 0, typing = null, autoTimer = null, auto = false, fullText = '';
const $ = id => document.getElementById(id);

function lineText(l){ return LANG === 'ta' ? l.ta : l.en; }
function stopTyping(){ if(typing){ clearInterval(typing); typing = null; } }
function renderDots(){
  const d = $('dots'); d.innerHTML = '';
  LINES.forEach((_, i) => { const e = document.createElement('i'); e.className = i < idx ? 'done' : (i === idx ? 'now' : ''); d.appendChild(e); });
}
function showLine(i, instant){
  stopTyping(); clearTimeout(autoTimer);
  idx = Math.max(0, Math.min(LINES.length - 1, i));
  const l = LINES[idx];
  const isR = l.w === 'R';
  $('charR').classList.toggle('on', isR); $('charC').classList.toggle('on', !isR);
  $('charR').classList.toggle('talking', isR); $('charC').classList.toggle('talking', !isR);
  const b = $('bubble'); b.className = 'bubble ' + (isR ? 'r' : 'c');
  $('who').textContent = isR ? T('Raja','ராஜா') : T('Chittu','சிட்டு');
  fullText = lineText(l);
  const bt = $('btext'), caret = $('caret');
  renderDots();
  $('prevBtn').disabled = idx === 0;
  const last = idx === LINES.length - 1;
  $('endcta').classList.toggle('show', last);
  const finish = () => {
    stopTyping(); bt.textContent = fullText; caret.style.display = 'none';
    $('charR').classList.remove('talking'); $('charC').classList.remove('talking');
    if(auto && idx < LINES.length - 1){ autoTimer = setTimeout(() => showLine(idx + 1), 1600); }
  };
  if(instant){ finish(); return; }
  bt.textContent = ''; caret.style.display = '';
  let n = 0;
  typing = setInterval(() => {
    n += 2; bt.textContent = fullText.slice(0, n);
    if(n >= fullText.length){ finish(); }
  }, 28);
}
$('nextBtn').addEventListener('click', () => {
  if(typing){ showLine(idx, true); return; }       // first click finishes the typing
  if(idx < LINES.length - 1) showLine(idx + 1);
});
$('prevBtn').addEventListener('click', () => { if(idx > 0) showLine(idx - 1); });
$('autoBtn').addEventListener('click', () => {
  auto = !auto; $('autoBtn').textContent = auto ? T(...TXT.autoOn.slice()) : T(...TXT.auto.slice());
  if(auto){ if(!typing) showLine(idx + 1 <= LINES.length - 1 ? idx + 1 : idx); } else { clearTimeout(autoTimer); }
});
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
  if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); $('nextBtn').click(); }
  if(e.key === 'ArrowLeft'){ $('prevBtn').click(); }
});

      '<div class="face"><span class="chip">' + T(...t.ch) + '</span><div class="scene"><span>' + t.em.split('|').join('</span><span>') + '</span></div>' +
      '<h3>' + T(...t.t) + '</h3><p>' + T(...t.p) + '</p><div class="hint">' + T(...TXT.flipHint) + '</div></div>' +
      '<div class="face back"><span class="chip">' + T(...t.ch) + '</span><h3>' + T('Physics word','ஃபிசிக்ஸ் பேரு') + '</h3><p>' + T(...t.b) + '</p>' +
      '<a class="go" href="' + t.file + '">' + T(...TXT.openLesson) + '</a></div>' +
    '</div></div>').join('');
  document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', e => { if(e.target.closest('a')) return; t.classList.toggle('flip'); }));

  // quiz (preserve answered state)
  const wrap = $('qs'); const state = [...wrap.querySelectorAll('.q')].map(q => q.dataset.pick);
  wrap.innerHTML = QS.map((q, qi) =>
    '<div class="q" data-i="' + qi + '"' + (state[qi] !== undefined ? ' data-pick="' + state[qi] + '"' : '') + '><div class="qt">' + (qi + 1) + '. ' + T(...q.q) + '</div><div class="opts">' +
    q.o.map((o, oi) => {
      const picked = state[qi] !== undefined;
      let cls = 'opt'; if(picked){ if(oi === q.c) cls += ' ok'; else if(String(oi) === state[qi]) cls += ' no'; }
      return '<button class="' + cls + '" data-o="' + oi + '"' + (picked ? ' disabled' : '') + '>' + T(...o) + '</button>';
    }).join('') + '</div><div class="why' + (state[qi] !== undefined ? ' show' : '') + '">' + T(...q.why) + '</div></div>').join('');
  wrap.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const q = b.closest('.q'); const qi = +q.dataset.i;
    q.dataset.pick = b.dataset.o;
    if(+b.dataset.o === QS[qi].c) correct++;
    answered++;
    renderStatic();
    if(answered === QS.length){ confetti(); }
  }));
  $('score').textContent = answered === QS.length
    ? (correct === QS.length ? T('🎉 3/3 — you ALREADY know physics! Raja is shocked. 🐒','🎉 3/3 — உனக்கு ஏற்கனவே ஃபிசிக்ஸ் தெரியும்! ராஜாவே ஆச்சரியப்படுறான். 🐒')
                             : T('🙂 ' + correct + '/3 — and you will learn the rest together with us!','🙂 ' + correct + '/3 — மீதிய எங்க கூட சேர்ந்து கத்துக்கலாம்!'))
    : '';

  // road
  let earned = [];
  try{ earned = JSON.parse(safeGet('scx_badges') || '[]'); }catch(e){}
  $('roadList').innerHTML = ROAD.map(r => {
    const n = r.badges.filter(b => earned.includes(b)).length;
    return '<a class="stop" href="' + r.file + '"><div class="n">' + r.n + '</div><div><h3>' + T(...r.t) + '</h3><div class="say">' + T(...r.say) + '</div></div><div class="pips">🏅 ' + n + '/5</div></a>';
  }).join('');
}

/* tiny confetti */
function confetti(){
  const c = document.createElement('canvas'); c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:300;';
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const x = c.getContext('2d'); const cols = ['#5ee0c2','#8b7bff','#ff9f6b','#ffd166','#ef476f'];
  let ps = Array.from({length:90}, () => ({x:c.width/2+(Math.random()-.5)*240,y:c.height*.3,vx:(Math.random()-.5)*9,vy:Math.random()*-7-2,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],l:110}));
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.vy += .28; p.x += p.vx; p.y += p.vy; p.l--; x.globalAlpha = Math.max(0,p.l/110); x.fillStyle = p.c; x.fillRect(p.x,p.y,p.s,p.s); });
    ps = ps.filter(p => p.l > 0);
    if(ps.length) requestAnimationFrame(tick); else c.remove();
  })();
}
